packages:
  - packages/*

strictDepBuilds: true
blockExoticSubdeps: true
allowBuilds:
  esbuild: false
  unrs-resolver: false

minimumReleaseAge: 4320
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 43200

updateConfig:
  # TypeScript stays on 6, which typescript-eslint supports, and `@types/node` on 24, the Node the
  # packages target
  ignoreDependencies:
    - typescript
    - '@types/node'

peerDependencyRules:
  allowedVersions:
    # No release accepts these majors yet, and the tests pass with them. Remove each once its plugin
    # widens its peer range
    eslint-plugin-markdown-preferences>@eslint/markdown: '9'
    stylelint-plugin-use-baseline>stylelint: '18'

auditConfig:
  ignoreGhsas:
    # Fixed only in minimatch 11. eslint-plugin-sonarjs and eslint-plugin-jsx-a11y-x still install
    # minimatch 10, and never set the vulnerable `optimizationLevel` 2. Remove once they move to
    # minimatch 11.0.1+
    - GHSA-g3hv-75wg-m249

