name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # On a push to main, outputs tested=true when this workflow already passed on the merged PR's head with the same files
  gate:
    uses: gpahal/ci/.github/workflows/skip-if-tested.yml@ee5b876c99dc4af15f288630704e48421a637716 # v1.1.0
    permissions:
      actions: read
      contents: read
      pull-requests: read

  # The tasks of `pnpm check`, one job for each kind, and the canaries, which only CI runs. They
  # take about 1 to 2 minutes each on a 4-vCPU runner, where `pnpm check` alone takes about 6. The
  # `typecheck` job fails when these jobs run other tasks than `pnpm check` and the canaries
  tasks:
    name: ${{ matrix.name }}
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: typecheck
            tasks: build typecheck typecheck-root typecheck-release
          - name: lint
            tasks: lint-check lint-check-root fmt-check knip
          - name: test
            tasks: test
          # The canaries, which fail once upstream fixes a bug that a workaround exists for. Only CI
          # runs them, so an upstream release fails CI rather than a local `pnpm check`
          - name: test-canaries
            tasks: test-canaries
          - name: test-recipes
            tasks: test-recipes
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the version in `package.json`'s `packageManager` field
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - id: node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - if: matrix.name == 'typecheck'
        name: Check that the jobs run the tasks of `pnpm check` and the canaries
        run: |
          check="$(node -p "[...require('./package.json').scripts.check.split(' ').filter((word) => /^[a-z]/.test(word)).slice(2), 'test-canaries'].sort().join(' ')")"
          jobs="$(yq '.jobs.tasks.strategy.matrix.include[].tasks' .github/workflows/ci.yml | xargs -n 1 | LC_ALL=C sort | xargs)"
          if [ "$check" != "$jobs" ]; then
            echo "pnpm check and the canaries run '$check', but the CI jobs run '$jobs'. Update the matrix in ci.yml"
            exit 1
          fi
      # Only shipped dependencies gate CI, so a new dev-only advisory doesn't block unrelated PRs
      - if: matrix.name == 'typecheck'
        run: pnpm audit --prod
      # Turbo's local cache, one for each job and Node version, saved under the commit and restored
      # from the latest save. Turbo's task hashes leave out the Node version, so a key without it
      # would replay the previous release's passes after a new Node release. GitHub scopes a pull
      # request's caches to its ref, so a pull request reads main's cache but can't write it. Main
      # saves its cache only when `gate` doesn't skip these jobs, which it does after merging a pull
      # request that passed, so main's cache can be older than main
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ matrix.name }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-node-${{ steps.node.outputs.node-version }}-${{ matrix.name }}-
      - run: pnpm turbo run --continue=dependencies-successful ${{ matrix.tasks }}
      # The build rewrites `package.json` exports when entry points change, and a cache hit restores
      # them
      - run: ./scripts/verify-no-git-changes.sh

  # On a pull request, fails when it changes a published package without adding a changeset, or
  # changes what a published package ships or bundles without a changeset that names it. The
  # version PR of the Version workflow, which consumes the changesets, is exempt. Only accounts and
  # apps with write access can push its branch to this repository
  changesets:
    if: github.event_name == 'pull_request' && !(github.head_ref == 'changeset-release/main' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The full history, so `--since` finds where the pull request branched from its base
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - env:
          BASE_REF: ${{ github.base_ref }}
        run: pnpm verify-changesets --since "origin/$BASE_REF"

  # The status check that the `main` ruleset requires. It passes when every job of `tasks` passed,
  # or when `gate` skipped them, and `changesets` passed or didn't apply
  check:
    needs: [gate, tasks, changesets]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          GATE: ${{ needs.gate.result }}
          TASKS: ${{ needs.tasks.result }}
          CHANGESETS: ${{ needs.changesets.result }}
        run: |
          echo "gate: $GATE, tasks: $TASKS, changesets: $CHANGESETS"
          [ "$GATE" = success ] && { [ "$TASKS" = success ] || [ "$TASKS" = skipped ]; } && { [ "$CHANGESETS" = success ] || [ "$CHANGESETS" = skipped ]; }
