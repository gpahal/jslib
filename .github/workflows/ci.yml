name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # On a push to main, outputs tested=true when this workflow already passed on the merged PR's head with the same files
  gate:
    uses: gpahal/ci/.github/workflows/skip-if-tested.yml@ee5b876c99dc4af15f288630704e48421a637716 # v1.1.0
    permissions:
      actions: read
      contents: read
      pull-requests: read

  check:
    needs: gate
    if: needs.gate.outputs.tested != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs the version in `package.json`'s `packageManager` field
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Only shipped dependencies gate CI, so a new dev-only advisory doesn't block unrelated PRs
      - run: pnpm audit --prod
      # No remote Turbo cache, so every task runs from this checkout
      - run: pnpm check
      # The build rewrites `package.json` exports when entry points change
      - run: ./scripts/verify-no-git-changes.sh
