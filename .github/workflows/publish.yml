name: Publish

# Run by hand on main. Publishes every public package whose version isn't on npm yet, once CI's
# `check` passed for the commit. npm's trusted publishing trusts this file in the `npm` environment,
# so no npm token exists: pnpm exchanges the job's OIDC token for a publish token and attaches
# provenance
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  # Apart from `publish`, so a commit that CI didn't pass fails before the `npm` environment and its
  # OIDC permission
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/verify-ci-passed.sh

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # No cache, so the release can't restore files that an earlier run left, and no `registry-url`,
      # whose `.npmrc` expects an npm token
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          check-latest: true
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm cs-publish
