<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Theme</title>
  </head>
  <body>
    <!-- A toggle button: `type="submit"` would submit a form it's later placed in -->
    <button onclick="document.body.classList.toggle('dark')">Toggle theme</button>
  </body>
</html>
